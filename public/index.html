<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desayuno del Señor de los Juguitos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@400;600;700&display=swap">
    <style>
        /* ——— Tokens ——— */
        :root {
            --bg:        #f8f5ef;
            --surface:   #ffffff;
            --surface2:  #efece4;
            --fg:        #1a1917;
            --fg-muted:  #7c7568;
            --accent:    #15803d;
            --accent-lt: #dcfce7;
            --accent-fg: #15803d;
            --amber:     #b45309;
            --amber-lt:  #fef3c7;
            --border:    #e3dfd4;
            --hero-bg:   #161411;
            --hero-fg:   #f0ece2;
            --btn-fg:    #ffffff;
            --shadow:    0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:        #131210;
                --surface:   #1d1b17;
                --surface2:  #252219;
                --fg:        #ece8df;
                --fg-muted:  #9b9284;
                --accent:    #4ade80;
                --accent-lt: #052e16;
                --accent-fg: #4ade80;
                --amber:     #fbbf24;
                --amber-lt:  #1c1500;
                --border:    #2c2920;
                --hero-bg:   #0d0c0a;
                --hero-fg:   #ece8df;
                --btn-fg:    #0a150d;
                --shadow:    0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg:        #131210;
            --surface:   #1d1b17;
            --surface2:  #252219;
            --fg:        #ece8df;
            --fg-muted:  #9b9284;
            --accent:    #4ade80;
            --accent-lt: #052e16;
            --accent-fg: #4ade80;
            --amber:     #fbbf24;
            --amber-lt:  #1c1500;
            --border:    #2c2920;
            --hero-bg:   #0d0c0a;
            --hero-fg:   #ece8df;
            --btn-fg:    #0a150d;
            --shadow:    0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ——— Hero ——— */
        .hero {
            background: var(--hero-bg);
            color: var(--hero-fg);
            padding: 3rem max(24px, 5vw) 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 90% at 10% 70%, rgba(21,128,61,.28) 0%, transparent 100%),
                radial-gradient(ellipse 45% 60% at 88% 15%, rgba(180,83,9,.2) 0%, transparent 100%);
            pointer-events: none;
        }

        .hero-inner {
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero-eyebrow {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 .875rem;
        }

        .hero h1 {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            font-weight: 800;
            line-height: 1.12;
            text-wrap: balance;
            margin: 0 0 .5rem;
            color: var(--hero-fg);
        }

        .hero-sub {
            font-size: 1rem;
            color: var(--hero-fg);
            opacity: .5;
            margin: 0 0 2rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: .625rem;
        }

        .nav-links a {
            font-family: 'Nunito', sans-serif;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .01em;
            color: var(--hero-bg);
            background: var(--hero-fg);
            text-decoration: none;
            padding: .45rem 1.1rem;
            border-radius: 999px;
            transition: opacity .15s, transform .15s;
            display: inline-block;
        }

        .nav-links a:hover {
            opacity: .82;
            transform: translateY(-1px);
        }

        /* ——— Content area ——— */
        .content {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2.5rem max(16px, 3vw);
        }

        .content-header {
            display: flex;
            align-items: center;
            gap: .875rem;
            margin-bottom: 1.5rem;
        }

        .section-label {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .13em;
            text-transform: uppercase;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        .divider {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ——— Cards ——— */
        #app {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: .5rem;
            box-shadow: var(--shadow);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
        }

        .card-emoji {
            font-size: 2.75rem;
            line-height: 1;
            display: block;
        }

        .card-name {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--fg);
            margin: .25rem 0 0;
            line-height: 1.3;
            text-wrap: balance;
        }

        .card-desc {
            font-size: .875rem;
            color: var(--fg-muted);
            line-height: 1.5;
            flex: 1;
            margin: 0;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: .5rem;
            padding-top: .875rem;
            margin-top: .25rem;
            border-top: 1px solid var(--border);
        }

        .vote-pill {
            background: var(--accent-lt);
            color: var(--accent-fg);
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: .95rem;
            font-weight: 700;
            padding: .3rem .75rem;
            border-radius: 999px;
            font-variant-numeric: tabular-nums;
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            user-select: none;
        }

        .vote-pill::before {
            content: '▲';
            font-size: .6rem;
            opacity: .7;
        }

        .vote-btn {
            font-family: 'Nunito', sans-serif;
            font-size: .825rem;
            font-weight: 700;
            background: var(--accent);
            color: var(--btn-fg);
            border: none;
            padding: .45rem 1.1rem;
            border-radius: 999px;
            cursor: pointer;
            transition: filter .15s, transform .15s;
        }

        .vote-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .vote-btn:active {
            transform: translateY(0);
        }

        /* ——— Add section ——— */
        .add-section {
            margin-top: 2.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .add-section h2 {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            margin: 0 0 1rem;
            color: var(--fg);
        }

        .input-group {
            display: flex;
            gap: .75rem;
            flex-wrap: wrap;
        }

        #new-option-input {
            font-family: 'Nunito', sans-serif;
            font-size: .9rem;
            padding: .6rem 1.1rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface2);
            color: var(--fg);
            flex: 1;
            min-width: 150px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        #new-option-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-lt);
        }

        #new-option-input::placeholder {
            color: var(--fg-muted);
        }

        .add-btn {
            font-family: 'Nunito', sans-serif;
            font-size: .825rem;
            font-weight: 700;
            background: var(--amber);
            color: #fff;
            border: none;
            padding: .6rem 1.25rem;
            border-radius: 999px;
            cursor: pointer;
            transition: filter .15s;
            white-space: nowrap;
        }

        .add-btn:hover { filter: brightness(1.1); }

        /* ——— Loading / error ——— */
        .status-msg {
            color: var(--fg-muted);
            font-size: .95rem;
            padding: 2rem 0;
            grid-column: 1 / -1;
        }

        /* ——— Footer ——— */
        footer {
            text-align: center;
            padding: 2rem max(16px, 3vw);
            font-size: .75rem;
            color: var(--fg-muted);
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        /* ——— Responsive ——— */
        @media (max-width: 500px) {
            .hero { padding: 2rem 1rem 1.75rem; }
            #app { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-inner">
            <p class="hero-eyebrow">Votación semanal</p>
            <h1 id="titulo">Desayuno del Señor de los Juguitos</h1>
            <p class="hero-sub" id="subtitulo">Elige tu desayuno favorito</p>
            <nav class="nav-links">
                <a href="/evaluation.html">⭐ Calificar Platos</a>
                <a href="/history.html">📊 Ver Historial</a>
            </nav>
        </div>
    </header>

    <main class="content">
        <div class="content-header">
            <span class="section-label">Opciones disponibles</span>
            <div class="divider"></div>
        </div>

        <div id="app">
            <p class="status-msg">Cargando opciones...</p>
        </div>

        <div class="add-section" id="add-section">
            <h2>¿Falta una opción?</h2>
            <div class="input-group">
                <input type="text" id="new-option-input" placeholder="Escribe tu opción...">
                <button class="add-btn">Añadir</button>
            </div>
        </div>
    </main>

    <footer>
        menu.ivansystems.xyz — del Señor de los Juguitos
    </footer>

    <script>
        const appDiv = document.getElementById('app');
        const params  = new URLSearchParams(window.location.search);

        // --- Título y subtítulo según ?tipo= ---
        const tipo = (params.get('tipo') || 'desayuno').toLowerCase();
        const labels = {
            desayuno: ['Desayuno del Señor de los Juguitos', 'Elige tu desayuno favorito'],
            comida:   ['Comida del Señor de los Juguitos',   'Elige tu comida favorita'],
            cena:     ['Cena del Señor de los Juguitos',     'Elige tu cena favorita'],
        };
        const [titulo, subtitulo] = labels[tipo] || labels['desayuno'];
        document.getElementById('titulo').textContent    = titulo;
        document.getElementById('subtitulo').textContent = subtitulo;
        document.title = titulo;

        // --- Opciones desde URL (?opciones=Op1|Op2|Op3) o desde API ---
        const opcionesParam = params.get('opciones');
        const storageKey    = 'votes_' + window.location.search;

        const defaultEmojis = ['🍽️','🥘','🌮','🍕','🍔','🌯','🥗','🍜','🍱','🍣','🥙','🫔'];

        function parseOption(str) {
            const match = str.match(/^(\p{Extended_Pictographic}+)\s*/u);
            if (match) return { emoji: match[1], name: str.slice(match[0].length).trim() };
            return { emoji: null, name: str.trim() };
        }

        async function loadCustom(raw) {
            document.getElementById('add-section').hidden = true;
            let votes = {};
            try {
                const r = await fetch('/api/custom-votes?opciones=' + encodeURIComponent(opcionesParam));
                votes = await r.json();
            } catch {}
            const items = raw.map((r, i) => ({ id: i, ...parseOption(r), votes: votes[i] || 0 }));
            renderCustom(items, raw);
        }

        async function voteCustom(id, raw) {
            try {
                await fetch('/api/custom-vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ opciones: opcionesParam, id })
                });
            } catch {}
            loadCustom(raw);
        }

        function renderCustom(items, raw) {
            appDiv.innerHTML = '';
            items.forEach(item => {
                const emoji = item.emoji || defaultEmojis[item.id % defaultEmojis.length];
                const card  = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="card-emoji">${emoji}</span>
                    <h2 class="card-name">${item.name}</h2>
                    <div class="card-footer">
                        <span class="vote-pill">${item.votes}</span>
                        <button class="vote-btn">Votar</button>
                    </div>
                `;
                card.querySelector('.vote-btn').addEventListener('click', () => voteCustom(item.id, raw));
                appDiv.appendChild(card);
            });
        }

        async function loadData() {
            try {
                const response = await fetch('/api/breakfasts');
                const data = await response.json();
                render(data);
            } catch (err) {
                appDiv.innerHTML = '<p class="status-msg">UH OH! Server broke! 🤮</p>';
            }
        }

        async function vote(id) {
            try {
                const response = await fetch('/api/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: Number(id) })
                });
                if (response.ok) loadData();
            } catch (err) {
                alert("Vote failed! Internet is acting weird!");
            }
        }

        async function addOption() {
            const input = document.getElementById('new-option-input');
            const name  = input.value.trim();
            if (name === '') { alert('Escribe algo, no seas menso!'); return; }
            try {
                const response = await fetch('/api/add-option', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (response.ok) { input.value = ''; loadData(); }
            } catch (err) {
                alert("Oops! Something went wrong adding your option!");
            }
        }

        document.querySelector('.add-btn').addEventListener('click', addOption);

        function render(items) {
            appDiv.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="card-emoji">${item.emoji}</span>
                    <h2 class="card-name">${item.name}</h2>
                    <p class="card-desc">${item.desc}</p>
                    <div class="card-footer">
                        <span class="vote-pill">${item.votes}</span>
                        <button class="vote-btn">Votar</button>
                    </div>
                `;
                card.querySelector('.vote-btn').addEventListener('click', () => vote(item.id));
                appDiv.appendChild(card);
            });
        }

        if (opcionesParam) {
            const names = opcionesParam.split('|').map(s => s.trim()).filter(Boolean);
            loadCustom(names);
        } else {
            loadData();
        }
    </script>
</body>
</html>
