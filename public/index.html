<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESAYUNO DEL SEÑOR DE LOS JUGUITOS</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5rem;
            color: #e67e22;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 1.5rem;
        }

        .nav-links {
            margin-bottom: 2rem;
        }

        .nav-links a {
            color: white;
            font-size: 1.1rem;
            text-decoration: none;
            background: #34495e;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin: 0 10px;
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background: #2c3e50;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            width: 220px;
            color: #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #eaeaea;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .emoji {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 10px;
        }

        h2 { margin: 10px 0; font-size: 1.3rem; color: #2c3e50; }
        
        .desc { color: #7f8c8d; font-size: 0.95rem; min-height: 2.5em; }

        button {
            background-color: #e67e22;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background-color: #d35400;
        }

        .vote-count {
            font-size: 1.3rem;
            font-weight: bold;
            color: #e67e22;
            background: #fdf2e9;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            line-height: 45px;
            margin: 10px auto;
        }

        .add-section {
            background-color: #ffffff;
            padding: 20px;
            margin-top: 40px;
            border-radius: 16px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .add-section h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        .input-group {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        #new-option-input {
            font-family: inherit;
            font-size: 1rem;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #bdc3c7;
            flex: 1;
        }

        #new-option-input:focus {
            outline: none;
            border-color: #e67e22;
        }
        
        .add-btn {
            width: auto;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <h1 id="titulo">Desayuno del Señor de los Juguitos</h1>
    <p class="subtitle" id="subtitulo">Elige tu desayuno favorito</p>
    <div class="nav-links">
        <a href="/evaluation.html">Calificar Platos</a>
        <a href="/history.html">Ver Historial</a>
    </div>

    <div id="app" class="container">
        <h2>Loading yummy stuff...</h2>
    </div>

    <div class="add-section" id="add-section">
        <h2>¿Falta una opción?</h2>
        <div class="input-group">
            <input type="text" id="new-option-input" placeholder="Escribe tu opción...">
            <button class="add-btn" onclick="addOption()">Añadir</button>
        </div>
    </div>

    <script>
        const appDiv = document.getElementById('app');
        const params  = new URLSearchParams(window.location.search);

        // --- Título y subtítulo según ?tipo= ---
        const tipo = (params.get('tipo') || 'desayuno').toLowerCase();
        const labels = {
            desayuno: ['Desayuno del Señor de los Juguitos', 'Elige tu desayuno favorito'],
            comida:   ['Comida del Señor de los Juguitos',   'Elige tu comida favorita'],
            cena:     ['Cena del Señor de los Juguitos',     'Elige tu cena favorita'],
        };
        const [titulo, subtitulo] = labels[tipo] || labels['desayuno'];
        document.getElementById('titulo').textContent    = titulo;
        document.getElementById('subtitulo').textContent = subtitulo;
        document.title = titulo;

        // --- Opciones desde URL (?opciones=Op1|Op2|Op3) o desde API ---
        const opcionesParam = params.get('opciones');
        const storageKey    = 'votes_' + window.location.search; // votos por URL única

        function getVotes() {
            try { return JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { return {}; }
        }
        function saveVotes(v) {
            try { localStorage.setItem(storageKey, JSON.stringify(v)); } catch {}
        }

        // Opciones personalizadas desde URL — votos en localStorage
        const defaultEmojis = ['🍽️','🥘','🌮','🍕','🍔','🌯','🥗','🍜','🍱','🍣','🥙','🫔'];

        function parseOption(str) {
            const match = str.match(/^(\p{Extended_Pictographic}+)\s*/u);
            if (match) return { emoji: match[1], name: str.slice(match[0].length).trim() };
            return { emoji: null, name: str.trim() };
        }

        function loadCustom(raw) {
            document.getElementById('add-section').hidden = true;
            const votes = getVotes();
            const items = raw.map((r, i) => ({ id: i, ...parseOption(r), votes: votes[i] || 0 }));
            renderCustom(items, raw);
        }

        function voteCustom(id, raw) {
            const votes = getVotes();
            votes[id] = (votes[id] || 0) + 1;
            saveVotes(votes);
            loadCustom(raw);
        }

        function renderCustom(items, raw) {
            appDiv.innerHTML = '';
            items.forEach(item => {
                const emoji = item.emoji || defaultEmojis[item.id % defaultEmojis.length];
                const card  = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="emoji">${emoji}</span>
                    <h2>${item.name}</h2>
                    <div class="vote-count">${item.votes}</div>
                    <button onclick="voteCustom(${item.id}, ${JSON.stringify(raw)})">Votar</button>
                `;
                appDiv.appendChild(card);
            });
        }

        // Opciones desde API — comportamiento original
        async function loadData() {
            try {
                const response = await fetch('/api/breakfasts');
                const data = await response.json();
                render(data);
            } catch (err) {
                appDiv.innerHTML = "<h2>UH OH! Server broke! 🤮</h2>";
            }
        }

        async function vote(id) {
            try {
                const response = await fetch('/api/vote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                if (response.ok) loadData();
            } catch (err) {
                alert("Vote failed! Internet is acting weird!");
            }
        }

        async function addOption() {
            const input = document.getElementById('new-option-input');
            const name  = input.value.trim();
            if (name === '') { alert('Escribe algo, no seas menso!'); return; }
            try {
                const response = await fetch('/api/add-option', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (response.ok) { input.value = ''; loadData(); }
            } catch (err) {
                alert("Oops! Something went wrong adding your option!");
            }
        }

        function render(items) {
            appDiv.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <span class="emoji">${item.emoji}</span>
                    <h2>${item.name}</h2>
                    <p class="desc">${item.desc}</p>
                    <div class="vote-count">${item.votes}</div>
                    <button onclick="vote(${item.id})">Votar</button>
                `;
                appDiv.appendChild(card);
            });
        }

        // --- Entrada ---
        if (opcionesParam) {
            const names = opcionesParam.split('|').map(s => s.trim()).filter(Boolean);
            loadCustom(names);  // raw strings, may include leading emoji
        } else {
            loadData();
        }
    </script>
</body>
</html>
