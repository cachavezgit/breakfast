<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HISTORIAL DE DESAYUNOS</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            background: radial-gradient(circle, #aa44ff, #330066);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 4px 4px 0px #000;
            color: #ffff00;
            animation: wobble 3s infinite;
        }

        @keyframes wobble {
            0%   { transform: rotate(0deg); }
            25%  { transform: rotate(3deg); }
            50%  { transform: rotate(0deg); }
            75%  { transform: rotate(-3deg); }
            100% { transform: rotate(0deg); }
        }

        a.back-btn {
            color: white;
            font-size: 1.3rem;
            text-decoration: none;
            background: black;
            padding: 10px 18px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 30px;
        }

        a.back-btn:hover {
            background: #222;
        }

        #app {
            max-width: 900px;
            margin: 0 auto;
        }

        .week-block {
            background: rgba(255, 255, 255, 0.12);
            border: 4px solid #ffff00;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 35px;
            box-shadow: 8px 8px 0px #000;
        }

        .week-title {
            font-size: 1.6rem;
            color: #ffff00;
            text-shadow: 2px 2px 0 #000;
            margin: 0 0 16px 0;
        }

        .meals-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .meal-card {
            background: #fff;
            color: #000;
            border: 4px solid #000;
            border-radius: 16px;
            padding: 16px 20px;
            width: 200px;
            box-shadow: 6px 6px 0 #000;
            position: relative;
        }

        .meal-name {
            font-size: 1rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            min-height: 2.5rem;
        }

        .meal-score {
            font-size: 2.5rem;
            font-weight: bold;
            color: #330066;
            line-height: 1;
            margin-bottom: 4px;
        }

        .meal-score-label {
            font-size: 0.75rem;
            color: #555;
            margin-bottom: 8px;
        }

        .medal {
            font-size: 1.8rem;
            position: absolute;
            top: -16px;
            right: -10px;
        }

        .votes-badge {
            display: inline-block;
            background: #aa44ff;
            color: white;
            border-radius: 50px;
            padding: 3px 10px;
            font-size: 0.8rem;
            border: 2px solid #000;
        }

        .no-ratings {
            color: #aaa;
            font-style: italic;
            font-size: 0.85rem;
        }

        #loading {
            font-size: 2rem;
            margin-top: 60px;
            color: #ffff00;
        }

        #error-msg {
            display: none;
            background: #ff3333;
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>📜 HISTORIAL DE DESAYUNOS 📜</h1>
    <a href="/" class="back-btn">🔙 Menu Principal</a>

    <div id="app">
        <div id="loading">Cargando el historial... 🍳</div>
        <div id="error-msg">No se pudo cargar el historial. El server anda de vacaciones. 🏖️</div>
    </div>

    <script>
        const appDiv   = document.getElementById('app');
        const loading  = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');

        function formatWeek(start, end) {
            const opts = { day: 'numeric', month: 'short', year: 'numeric' };
            const s = new Date(start + 'T12:00:00').toLocaleDateString('es-MX', opts);
            const e = new Date(end   + 'T12:00:00').toLocaleDateString('es-MX', opts);
            return `${s} — ${e}`;
        }

        function medal(rank) {
            if (rank === 0) return '🥇';
            if (rank === 1) return '🥈';
            if (rank === 2) return '🥉';
            return '';
        }

        function renderHistory(data) {
            loading.style.display = 'none';

            if (!data.length) {
                appDiv.innerHTML = '<p style="font-size:1.5rem; color:#ffff00;">No hay historial todavía. ¡Come algo primero!</p>';
                return;
            }

            // Group by week_start
            const weeks = {};
            data.forEach(item => {
                const key = item.week_start;
                if (!weeks[key]) weeks[key] = { week_start: item.week_start, week_end: item.week_end, meals: [] };
                weeks[key].meals.push(item);
            });

            // Sort weeks descending
            const sortedKeys = Object.keys(weeks).sort((a, b) => b.localeCompare(a));

            sortedKeys.forEach(key => {
                const week = weeks[key];

                // Sort meals by average desc (for medals)
                const meals = [...week.meals].sort((a, b) => (b.average || 0) - (a.average || 0));

                const block = document.createElement('div');
                block.className = 'week-block';

                const title = document.createElement('h2');
                title.className = 'week-title';
                title.textContent = '📅 Semana: ' + formatWeek(week.week_start, week.week_end);
                block.appendChild(title);

                const grid = document.createElement('div');
                grid.className = 'meals-grid';

                meals.forEach((meal, rank) => {
                    const card = document.createElement('div');
                    card.className = 'meal-card';

                    const hasRatings = meal.count_ratings > 0;
                    const avg = hasRatings ? (meal.average !== null ? meal.average : '—') : '—';
                    const m = (hasRatings && rank < 3) ? `<span class="medal">${medal(rank)}</span>` : '';

                    card.innerHTML = `
                        ${m}
                        <p class="meal-name">${meal.name}</p>
                        <div class="meal-score">${avg}</div>
                        <div class="meal-score-label">promedio</div>
                        ${hasRatings
                            ? `<span class="votes-badge">⭐ ${meal.count_ratings} voto${meal.count_ratings !== 1 ? 's' : ''}</span>`
                            : `<span class="no-ratings">sin calificaciones</span>`
                        }
                    `;
                    grid.appendChild(card);
                });

                block.appendChild(grid);
                appDiv.appendChild(block);
            });
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                renderHistory(data);
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
                console.error(err);
            }
        }

        loadHistory();
    </script>
</body>
</html>
