<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Desayunos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg:        #f8f5ef;
            --surface:   #ffffff;
            --surface2:  #efece4;
            --fg:        #1a1917;
            --fg-muted:  #7c7568;
            --accent:    #15803d;
            --accent-lt: #dcfce7;
            --accent-fg: #15803d;
            --amber:     #b45309;
            --amber-lt:  #fef3c7;
            --border:    #e3dfd4;
            --hero-bg:   #161411;
            --hero-fg:   #f0ece2;
            --btn-fg:    #ffffff;
            --shadow:    0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:        #131210;
                --surface:   #1d1b17;
                --surface2:  #252219;
                --fg:        #ece8df;
                --fg-muted:  #9b9284;
                --accent:    #4ade80;
                --accent-lt: #052e16;
                --accent-fg: #4ade80;
                --amber:     #fbbf24;
                --amber-lt:  #1c1500;
                --border:    #2c2920;
                --hero-bg:   #0d0c0a;
                --hero-fg:   #ece8df;
                --btn-fg:    #0a150d;
                --shadow:    0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg:        #131210;
            --surface:   #1d1b17;
            --surface2:  #252219;
            --fg:        #ece8df;
            --fg-muted:  #9b9284;
            --accent:    #4ade80;
            --accent-lt: #052e16;
            --accent-fg: #4ade80;
            --amber:     #fbbf24;
            --amber-lt:  #1c1500;
            --border:    #2c2920;
            --hero-bg:   #0d0c0a;
            --hero-fg:   #ece8df;
            --btn-fg:    #0a150d;
            --shadow:    0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ——— Hero ——— */
        .hero {
            background: var(--hero-bg);
            color: var(--hero-fg);
            padding: 3rem max(24px, 5vw) 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 90% at 10% 70%, rgba(21,128,61,.24) 0%, transparent 100%),
                radial-gradient(ellipse 40% 60% at 85% 20%, rgba(180,83,9,.16) 0%, transparent 100%);
            pointer-events: none;
        }

        .hero-inner {
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero-eyebrow {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 .875rem;
        }

        .hero h1 {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            font-weight: 800;
            line-height: 1.12;
            text-wrap: balance;
            margin: 0 0 .5rem;
            color: var(--hero-fg);
        }

        .hero-sub {
            font-size: 1rem;
            color: var(--hero-fg);
            opacity: .5;
            margin: 0 0 2rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: .625rem;
        }

        .nav-links a {
            font-family: 'Nunito', sans-serif;
            font-size: .8rem;
            font-weight: 700;
            color: var(--hero-bg);
            background: var(--hero-fg);
            text-decoration: none;
            padding: .45rem 1.1rem;
            border-radius: 999px;
            transition: opacity .15s, transform .15s;
            display: inline-block;
        }

        .nav-links a:hover {
            opacity: .82;
            transform: translateY(-1px);
        }

        /* ——— Content ——— */
        .content {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2.5rem max(16px, 3vw);
        }

        /* ——— Week block ——— */
        .week-block {
            margin-bottom: 2.5rem;
        }

        .week-header {
            display: flex;
            align-items: center;
            gap: .875rem;
            margin-bottom: 1rem;
        }

        .week-label {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .13em;
            text-transform: uppercase;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        .week-date {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: .95rem;
            font-weight: 700;
            color: var(--fg);
        }

        .week-divider {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .meals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        /* ——— Meal card ——— */
        .meal-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: .4rem;
            box-shadow: var(--shadow);
            position: relative;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .meal-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,.1);
        }

        .medal {
            position: absolute;
            top: -10px;
            right: -6px;
            font-size: 1.5rem;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,.2));
        }

        .meal-name {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--fg);
            margin: 0;
            line-height: 1.3;
            text-wrap: balance;
            padding-right: 1.5rem;
        }

        .meal-score {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-fg);
            line-height: 1;
            margin-top: .25rem;
            font-variant-numeric: tabular-nums;
        }

        .meal-score-label {
            font-size: .75rem;
            color: var(--fg-muted);
            margin-bottom: .25rem;
        }

        .votes-badge {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            background: var(--accent-lt);
            color: var(--accent-fg);
            border-radius: 999px;
            padding: .25rem .7rem;
            font-size: .78rem;
            font-weight: 700;
            width: fit-content;
        }

        .no-ratings {
            font-size: .8rem;
            color: var(--fg-muted);
            font-style: italic;
        }

        /* ——— States ——— */
        .status-msg {
            color: var(--fg-muted);
            font-size: .95rem;
            padding: 2rem 0;
        }

        .error-block {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            color: var(--fg-muted);
            box-shadow: var(--shadow);
        }

        footer {
            text-align: center;
            padding: 2rem max(16px, 3vw);
            font-size: .75rem;
            color: var(--fg-muted);
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        @media (max-width: 500px) {
            .hero { padding: 2rem 1rem 1.75rem; }
            .meals-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-inner">
            <p class="hero-eyebrow">Resultados</p>
            <h1>Historial de Desayunos</h1>
            <p class="hero-sub">Calificaciones por semana</p>
            <nav class="nav-links">
                <a href="/">🍽️ Menú Principal</a>
                <a href="/evaluation.html">⭐ Calificar Platos</a>
            </nav>
        </div>
    </header>

    <main class="content">
        <div id="app">
            <p class="status-msg">Cargando el historial...</p>
        </div>
    </main>

    <footer>
        menu.ivansystems.xyz — del Señor de los Juguitos
    </footer>

    <script>
        const appDiv = document.getElementById('app');

        function formatWeek(start, end) {
            const opts = { day: 'numeric', month: 'short', year: 'numeric' };
            const s = new Date(start + 'T12:00:00').toLocaleDateString('es-MX', opts);
            const e = new Date(end   + 'T12:00:00').toLocaleDateString('es-MX', opts);
            return `${s} — ${e}`;
        }

        function medal(rank) {
            if (rank === 0) return '🥇';
            if (rank === 1) return '🥈';
            if (rank === 2) return '🥉';
            return '';
        }

        function renderHistory(data) {
            appDiv.innerHTML = '';

            if (!data.length) {
                appDiv.innerHTML = '<p class="status-msg">No hay historial todavía. ¡Come algo primero!</p>';
                return;
            }

            const weeks = {};
            data.forEach(item => {
                const key = item.week_start;
                if (!weeks[key]) weeks[key] = { week_start: item.week_start, week_end: item.week_end, meals: [] };
                weeks[key].meals.push(item);
            });

            const sortedKeys = Object.keys(weeks).sort((a, b) => b.localeCompare(a));

            sortedKeys.forEach(key => {
                const week = weeks[key];
                const meals = [...week.meals].sort((a, b) => (b.average || 0) - (a.average || 0));

                const block = document.createElement('div');
                block.className = 'week-block';

                const header = document.createElement('div');
                header.className = 'week-header';
                header.innerHTML = `
                    <span class="week-label">Semana</span>
                    <span class="week-date">${formatWeek(week.week_start, week.week_end)}</span>
                    <div class="week-divider"></div>
                `;
                block.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'meals-grid';

                meals.forEach((meal, rank) => {
                    const card = document.createElement('div');
                    card.className = 'meal-card';

                    const hasRatings = meal.count_ratings > 0;
                    const avg = hasRatings && meal.average !== null ? meal.average : '—';
                    const m = (hasRatings && rank < 3) ? `<span class="medal">${medal(rank)}</span>` : '';
                    const countText = meal.count_ratings === 1
                        ? '1 voto'
                        : `${meal.count_ratings} votos`;

                    card.innerHTML = `
                        ${m}
                        <p class="meal-name">${meal.name}</p>
                        <div class="meal-score">${avg}</div>
                        <div class="meal-score-label">promedio</div>
                        ${hasRatings
                            ? `<span class="votes-badge">⭐ ${countText}</span>`
                            : `<span class="no-ratings">sin calificaciones</span>`
                        }
                    `;
                    grid.appendChild(card);
                });

                block.appendChild(grid);
                appDiv.appendChild(block);
            });
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                renderHistory(data);
            } catch (err) {
                appDiv.innerHTML = `
                    <div class="error-block">
                        El server anda de vacaciones 🏖️<br>
                        <small style="margin-top:.5rem;display:block">${err.message}</small>
                    </div>
                `;
                console.error(err);
            }
        }

        loadHistory();
    </script>
</body>
</html>
