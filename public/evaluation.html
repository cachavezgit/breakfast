<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD JUDGEMENT</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.5rem;
            color: #27ae60;
            margin-bottom: 1.5rem;
        }
        .nav-links {
            margin-bottom: 2rem;
        }
        .nav-links a {
            color: white;
            font-size: 1.1rem;
            text-decoration: none;
            background: #34495e;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            margin: 0 10px;
            transition: background 0.2s;
        }
        .nav-links a:hover {
            background: #2c3e50;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px;
            width: 300px;
            color: #444;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
        }
        h2 { margin-top: 0; color: #2c3e50; }
        .score-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0;
        }
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        .rate-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #27ae60;
            background: #eafaf1;
            color: #27ae60;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.2s;
        }
        .rate-btn:hover {
            background: #27ae60;
            color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <h1>Calificar Platos</h1>
    <div class="nav-links">
        <a href="/">Menú Principal</a>
        <a href="/history.html">Ver Historial</a>
    </div>
    
    <div id="app" class="container">
        <h2>Loading...</h2>
    </div>

    <script>
        const appDiv = document.getElementById('app');

        async function loadData() {
            try {
                const res = await fetch('/api/evaluations');
                const data = await res.json();
                render(data);
            } catch (e) {
                appDiv.innerHTML = "<h2>Server exploded! 💥</h2>";
            }
        }

        async function rate(id, score) {
            try {
                await fetch('/api/rate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, score })
                });
                loadData();
            } catch (e) {
                alert('Rating failed!');
            }
        }

        function render(items) {
            appDiv.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let buttonsHtml = '';
                for(let i=0; i<=10; i++) {
                    buttonsHtml += `<button class="rate-btn" onclick="rate(${item.id}, ${i})">${i}</button>`;
                }

                card.innerHTML = `
                    <h2>${item.name}</h2>
                    <div class="score-display">Avg: ${item.average}</div>
                    <p>Rate this:</p>
                    <div class="buttons-container">
                        ${buttonsHtml}
                    </div>
                    <p style="font-size:0.8rem; color: #666;">(${item.count} votes)</p>
                `;
                appDiv.appendChild(card);
            });
        }

        loadData();
    </script>
</body>
</html>
