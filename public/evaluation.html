<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOD JUDGEMENT</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            background: radial-gradient(circle, #33cc33, #006600);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 4px 4px 0px #000;
            color: #ffff00;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #fff;
            border: 5px solid #000;
            border-radius: 20px;
            padding: 20px;
            width: 300px;
            color: black;
            box-shadow: 10px 10px 0px #000;
        }
        .score-display {
            font-size: 2rem;
            font-weight: bold;
            color: #006600;
            margin: 10px 0;
        }
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
        .rate-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid black;
            background: #ffcc00;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }
        .rate-btn:hover {
            background: #ff9900;
            transform: scale(1.2);
        }
        a {
            color: white;
            font-size: 1.5rem;
            text-decoration: none;
            background: black;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>⚖️ JUDGE THE FOOD ⚖️</h1>
    <a href="/">🔙 Back to Main Menu</a>
    <a href="/history.html" style="margin-left: 10px;">📜 Historial</a>
    
    <div id="app" class="container">
        <h2>Loading...</h2>
    </div>

    <script>
        const appDiv = document.getElementById('app');

        async function loadData() {
            try {
                const res = await fetch('/api/evaluations');
                const data = await res.json();
                render(data);
            } catch (e) {
                appDiv.innerHTML = "<h2>Server exploded! 💥</h2>";
            }
        }

        async function rate(id, score) {
            try {
                await fetch('/api/rate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, score })
                });
                loadData();
            } catch (e) {
                alert('Rating failed!');
            }
        }

        function render(items) {
            appDiv.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let buttonsHtml = '';
                for(let i=0; i<=10; i++) {
                    buttonsHtml += `<button class="rate-btn" onclick="rate(${item.id}, ${i})">${i}</button>`;
                }

                card.innerHTML = `
                    <h2>${item.name}</h2>
                    <div class="score-display">Avg: ${item.average}</div>
                    <p>Rate this:</p>
                    <div class="buttons-container">
                        ${buttonsHtml}
                    </div>
                    <p style="font-size:0.8rem; color: #666;">(${item.count} votes)</p>
                `;
                appDiv.appendChild(card);
            });
        }

        loadData();
    </script>
</body>
</html>
