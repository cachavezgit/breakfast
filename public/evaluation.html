<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calificar Platos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Nunito:wght@400;600;700&display=swap">
    <style>
        :root {
            --bg:        #f8f5ef;
            --surface:   #ffffff;
            --surface2:  #efece4;
            --fg:        #1a1917;
            --fg-muted:  #7c7568;
            --accent:    #15803d;
            --accent-lt: #dcfce7;
            --accent-fg: #15803d;
            --amber:     #b45309;
            --border:    #e3dfd4;
            --hero-bg:   #161411;
            --hero-fg:   #f0ece2;
            --btn-fg:    #ffffff;
            --shadow:    0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg:        #131210;
                --surface:   #1d1b17;
                --surface2:  #252219;
                --fg:        #ece8df;
                --fg-muted:  #9b9284;
                --accent:    #4ade80;
                --accent-lt: #052e16;
                --accent-fg: #4ade80;
                --amber:     #fbbf24;
                --border:    #2c2920;
                --hero-bg:   #0d0c0a;
                --hero-fg:   #ece8df;
                --btn-fg:    #0a150d;
                --shadow:    0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
                color-scheme: dark;
            }
        }

        :root[data-theme="dark"] {
            --bg:        #131210;
            --surface:   #1d1b17;
            --surface2:  #252219;
            --fg:        #ece8df;
            --fg-muted:  #9b9284;
            --accent:    #4ade80;
            --accent-lt: #052e16;
            --accent-fg: #4ade80;
            --amber:     #fbbf24;
            --border:    #2c2920;
            --hero-bg:   #0d0c0a;
            --hero-fg:   #ece8df;
            --btn-fg:    #0a150d;
            --shadow:    0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: var(--bg);
            color: var(--fg);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* ——— Hero ——— */
        .hero {
            background: var(--hero-bg);
            color: var(--hero-fg);
            padding: 3rem max(24px, 5vw) 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 55% 90% at 10% 70%, rgba(21,128,61,.24) 0%, transparent 100%),
                radial-gradient(ellipse 40% 60% at 85% 20%, rgba(180,83,9,.16) 0%, transparent 100%);
            pointer-events: none;
        }

        .hero-inner {
            max-width: 1080px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero-eyebrow {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--accent);
            margin: 0 0 .875rem;
        }

        .hero h1 {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            font-weight: 800;
            line-height: 1.12;
            text-wrap: balance;
            margin: 0 0 .5rem;
            color: var(--hero-fg);
        }

        .hero-sub {
            font-size: 1rem;
            color: var(--hero-fg);
            opacity: .5;
            margin: 0 0 2rem;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: .625rem;
        }

        .nav-links a {
            font-family: 'Nunito', sans-serif;
            font-size: .8rem;
            font-weight: 700;
            color: var(--hero-bg);
            background: var(--hero-fg);
            text-decoration: none;
            padding: .45rem 1.1rem;
            border-radius: 999px;
            transition: opacity .15s, transform .15s;
            display: inline-block;
        }

        .nav-links a:hover {
            opacity: .82;
            transform: translateY(-1px);
        }

        /* ——— Content ——— */
        .content {
            max-width: 1080px;
            margin: 0 auto;
            padding: 2.5rem max(16px, 3vw);
        }

        .content-header {
            display: flex;
            align-items: center;
            gap: .875rem;
            margin-bottom: 1.5rem;
        }

        .section-label {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .13em;
            text-transform: uppercase;
            color: var(--fg-muted);
            white-space: nowrap;
        }

        .divider {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ——— Cards grid ——— */
        #app {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: .75rem;
            box-shadow: var(--shadow);
        }

        .card-name {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--fg);
            margin: 0;
            line-height: 1.3;
            text-wrap: balance;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: .5rem;
        }

        .score-value {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-fg);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .score-meta {
            font-size: .8rem;
            color: var(--fg-muted);
            line-height: 1.4;
        }

        /* ——— Rate buttons ——— */
        .rate-label {
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--fg-muted);
        }

        .rate-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: .35rem;
        }

        .rate-btn {
            font-family: 'Nunito', sans-serif;
            font-size: .8rem;
            font-weight: 700;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            background: var(--surface2);
            color: var(--fg-muted);
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s, transform .12s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rate-btn:hover {
            background: var(--accent);
            color: var(--btn-fg);
            border-color: var(--accent);
            transform: scale(1.12);
        }

        .rate-btn:active {
            transform: scale(.96);
        }

        /* ——— Status ——— */
        .status-msg {
            color: var(--fg-muted);
            font-size: .95rem;
            padding: 2rem 0;
            grid-column: 1 / -1;
        }

        footer {
            text-align: center;
            padding: 2rem max(16px, 3vw);
            font-size: .75rem;
            color: var(--fg-muted);
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }

        @media (max-width: 500px) {
            .hero { padding: 2rem 1rem 1.75rem; }
            #app { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-inner">
            <p class="hero-eyebrow">Evaluación semanal</p>
            <h1>Calificar Platos</h1>
            <p class="hero-sub">Dale una nota del 0 al 10 a cada opción</p>
            <nav class="nav-links">
                <a href="/">🍽️ Menú Principal</a>
                <a href="/history.html">📊 Ver Historial</a>
            </nav>
        </div>
    </header>

    <main class="content">
        <div class="content-header">
            <span class="section-label">Opciones de esta semana</span>
            <div class="divider"></div>
        </div>

        <div id="app">
            <p class="status-msg">Cargando...</p>
        </div>
    </main>

    <footer>
        menu.ivansystems.xyz — del Señor de los Juguitos
    </footer>

    <script>
        const appDiv = document.getElementById('app');

        async function loadData() {
            try {
                const res = await fetch('/api/evaluations');
                const data = await res.json();
                render(data);
            } catch (e) {
                appDiv.innerHTML = '<p class="status-msg">Server exploded! 💥</p>';
            }
        }

        async function rate(id, score) {
            try {
                await fetch('/api/rate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, score })
                });
                loadData();
            } catch (e) {
                alert('Rating failed!');
            }
        }

        function render(items) {
            appDiv.innerHTML = '';
            if (!items.length) {
                appDiv.innerHTML = '<p class="status-msg">No hay opciones esta semana todavía.</p>';
                return;
            }
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const avg = item.average !== null ? item.average : '—';
                const countText = item.count_ratings === 1
                    ? '1 calificación'
                    : `${item.count_ratings} calificaciones`;

                card.innerHTML = `
                    <h2 class="card-name">${item.name}</h2>
                    <div class="score-row">
                        <span class="score-value">${avg}</span>
                        <span class="score-meta">promedio<br>${countText}</span>
                    </div>
                    <span class="rate-label">Tu calificación</span>
                    <div class="rate-buttons"></div>
                `;

                const btnContainer = card.querySelector('.rate-buttons');
                for (let i = 0; i <= 10; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'rate-btn';
                    btn.textContent = i;
                    btn.addEventListener('click', () => rate(item.id, i));
                    btnContainer.appendChild(btn);
                }

                appDiv.appendChild(card);
            });
        }

        loadData();
    </script>
</body>
</html>
